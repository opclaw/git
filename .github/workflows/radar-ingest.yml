# .github/workflows/radar-ingest.yml  — ЕДИНСТВЕННЫЙ «сервер» MVP: cron на бесплатных минутах Actions.
# Положить в репозиторий как .github/workflows/radar-ingest.yml. Settings -> Pages -> Source: GitHub Actions.
name: radar-ingest
on:
  schedule: [{cron: "*/30 * * * *"}]          # каждые 30 мин: окно GH Archive = последние 4 часа
  workflow_dispatch: {}                        # ручной запуск, когда Т2 ждёт пачку
  issues: {types: [opened]}                    # опция: «@radar проверь этот репо» из issue
permissions:
  contents: write        # коммит обновлённого data/leads.json
  pages: write           # деплой статики через upload/deploy-pages
  id-token: write        # attestation для Pages
  models: read           # БЕЗ ЭТОГО GitHub Models вернёт 403 на GITHUB_TOKEN
concurrency: {group: radar, cancel-in-progress: false}
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 12   # ВАЛИДАТОР Actions: на верхнем уровне ключ недопустим, только в job
    environment: radar                          # тут секреты: OPENAI_API_KEY / ANTHROPIC_API_KEY (опц.)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mvp/requirements.txt   # файл не в корне -> без этой строки step падает
      - run: pip install -r mvp/requirements.txt   # пустой: ядро MVP только на stdlib, зависимостей нет
      - name: Ingest + scoring (детерминированно, без LLM)
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}", HOURS: "4", TOP: "40"}
        run: python3 mvp/ingest.py --hours ${HOURS} --top ${TOP}
      - name: LLM-обогащение (fit + краткое досье) — пропускается без ключа
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"     # GitHub Models даёт бесплатный inference по токену задачи
          OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}"
          RADAR_MODEL: "${{ vars.RADAR_MODEL || 'openai/gpt-4.1-mini' }}"
        run: python3 mvp/llm_enrich.py --in data/leads.json --out data/leads.json
      - name: Валидация контракта (схема lead.v1)
        run: python3 tools/validate_contracts.py data/leads.json
      - name: Commit данных (история лидов = git log, журнал решений бесплатно)
        run: |
          git config user.name radar-bot; git config user.email radar@bot
          cp data/leads.json "data/history/$(date -u +%Y-%m-%d-%H).json"
          python3 mvp/build_dashboard.py && cp dashboard.html index.html
          git add -A; git diff --cached --quiet || git commit -m "radar: $(date -u +%FT%TZ)"
          git push
      - name: Собрать каталог сайта (только витрина и данные, не весь репозиторий)
        run: |
          mkdir -p site/data && cp index.html site/index.html && cp data/leads.json site/data/leads.json
      - uses: actions/upload-pages-artifact@v4
        with: {path: "site"}
      - uses: actions/deploy-pages@v4
      - name: Итог прогона в лог (для разбора Т4/Т5)
        if: always()
        run: python3 -c "import json;d=json.load(open('data/leads.json'));w=d['window'];print('лидов',len(d['leads']),'| WatchEvent',w['watch_events'],'| API-вызовов',w['api_calls'],'| authenticated',w['authenticated']);print('с LLM:',sum(1 for l in d['leads'] if l.get('llm')),'из',len(d['leads']))" || echo "leads.json не найден - инжест падал, см. лог выше"
      - name: Алерт в Telegram/Slack, если нашлось что-то выше порога
        if: success()
        env: {TELEGRAM_BOT_TOKEN: "${{ secrets.TELEGRAM_BOT_TOKEN }}", TELEGRAM_CHAT_ID: "${{ vars.TELEGRAM_CHAT_ID }}"}
        run: python3 mvp/notify.py || true
